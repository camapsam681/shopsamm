<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NHÓM SAMM.NET</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;width:100%;overflow:hidden;position:fixed}
  body{background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;padding:0}

  /* FORM ĐĂNG NHẬP / ĐĂNG KÝ — căn giữa */
  .auth{width:90%;max-width:380px;background:#fff;border-radius:14px;padding:28px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:none;margin:auto}
  .auth.active{display:block}
  .auth h2{text-align:center;color:#0084ff;margin-bottom:6px}
  .auth .sub{text-align:center;color:#888;font-size:13px;margin-bottom:20px}
  .auth input{width:100%;padding:12px 14px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;outline:none;font-size:14px}
  .auth input:focus{border-color:#0084ff}
  .auth button{width:100%;padding:12px;border:none;background:#0084ff;color:#fff;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:4px}
  .auth button:disabled{background:#aaa}
  .auth .switch{text-align:center;font-size:13px;color:#666;margin-top:14px}
  .auth .switch a{color:#0084ff;cursor:pointer;font-weight:bold;text-decoration:none}
  .err{color:#e74c3c;font-size:13px;text-align:center;min-height:18px;margin-bottom:6px}
  .avatar-pick{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
  .avatar-pick .preview{width:80px;height:80px;border-radius:50%;background:#e4e6eb;display:flex;align-items:center;justify-content:center;font-size:32px;color:#999;cursor:pointer;border:3px dashed #ccc;overflow:hidden}
  .avatar-pick .preview img{width:100%;height:100%;object-fit:cover}
  .avatar-pick .preview input{display:none}
  .avatar-pick p{font-size:12px;color:#666;margin-top:6px}

  /* ===== KHUNG CHAT FULL MÀN HÌNH ===== */
  .chat{
    width:100vw;
    height:100vh;
    max-width:100vw;
    max-height:100vh;
    background:#fff;
    border-radius:0;
    display:none;
    flex-direction:column;
    overflow:hidden;
    box-shadow:none;
  }
  .chat.active{display:flex}

  .head{background:#0084ff;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top))}
  .head .group-av{width:42px;height:42px;border-radius:50%;background:#fff;color:#0084ff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:11px;flex-shrink:0}
  .head .info{flex:1;min-width:0}
  .head .info h3{font-size:15px}
  .head .info p{font-size:11px;opacity:.85}
  .head .my-av{width:40px;height:40px;border-radius:50%;background:#fff;color:#0084ff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;cursor:pointer;overflow:hidden;border:2px solid #fff;position:relative;flex-shrink:0}
  .head .my-av img{width:100%;height:100%;object-fit:cover}
  .head .my-av:hover::after{content:'📷';position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:15px}
  .head .logout{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;flex-shrink:0}

  .tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0e0;flex-shrink:0}
  .tab{flex:1;padding:13px;text-align:center;font-size:14px;font-weight:bold;color:#888;cursor:pointer;border-bottom:2px solid transparent;user-select:none}
  .tab.active{color:#0084ff;border-bottom-color:#0084ff}
  .tab .badge{display:inline-block;background:#e74c3c;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px}

  .msgs{flex:1;padding:14px;overflow-y:auto;background:#f7f9fb;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
  .msgs.hidden{display:none}
  .row{display:flex;gap:8px;max-width:80%}
  .me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:34px;height:34px;border-radius:50%;color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .msg{padding:9px 13px;border-radius:14px;font-size:14px;word-wrap:break-word;background:#e4e6eb;white-space:pre-wrap}
  .me .msg{background:#0084ff;color:#fff}
  .bot .msg{background:#fff3cd;border:1px solid #ffe066}
  .name{font-size:11px;color:#666;margin-bottom:3px}
  .bot .name{color:#d39e00;font-weight:bold}

  .bot .name.rainbow{
    background: linear-gradient(90deg,
      #ff0000, #ff7f00, #ffff00, #00ff00,
      #00ffff, #0000ff, #8b00ff, #ff0000);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: rainbowMove 3s linear infinite;
    font-weight: 900;
    letter-spacing: 1px;
  }
  @keyframes rainbowMove {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .bot .av.rainbow-av{
    background: linear-gradient(135deg,
      #ff0000, #ff7f00, #ffff00, #00ff00,
      #00ffff, #0000ff, #8b00ff);
    background-size: 200% 200%;
    animation: rainbowAv 3s linear infinite;
    font-size: 18px;
  }
  @keyframes rainbowAv {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .tick{
    display:inline-flex;align-items:center;justify-content:center;
    width:14px;height:14px;border-radius:50%;
    background:#1da1f2;color:#fff;font-size:10px;
    margin-left:4px;vertical-align:middle;
    box-shadow:0 0 0 1px #fff;
  }

  .msg img.chat-img{max-width:220px;max-height:220px;border-radius:8px;display:block;cursor:pointer;margin-top:4px}
  .msg .file-box{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);padding:8px;border-radius:8px;margin-top:4px;text-decoration:none;color:#050505}
  .me .msg .file-box{background:rgba(255,255,255,.2);color:#fff}
  .file-box .icon{font-size:20px}
  .file-box .info{font-size:12px;word-break:break-all}
  .file-box .info b{display:block;font-size:13px;margin-bottom:2px}
  .upload-bar{font-size:12px;color:#0084ff;text-align:center;padding:6px;background:#e8f4ff;font-weight:bold;display:none;flex-shrink:0}
  .music-box{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:10px;margin-top:8px;min-width:220px}
  .music-box .label{font-size:12px;color:#b8860b;font-weight:bold;margin-bottom:6px}
  .music-box audio{width:100%;margin-top:8px;height:36px}

  .bar{display:flex;padding:10px 12px;border-top:1px solid #ddd;gap:8px;background:#fff;align-items:center;flex-shrink:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .bar.hidden{display:none}
  .bar input[type=text]{flex:1;padding:11px 15px;border:1px solid #ccc;border-radius:22px;outline:none;font-size:15px}
  .bar .btn-attach{background:#e4e6eb;color:#333;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;border:none;flex-shrink:0}
  .bar .btn-attach:active{background:#d0d2d6}
  .bar button.send{padding:0 20px;border:none;background:#0084ff;color:#fff;border-radius:22px;cursor:pointer;font-weight:bold;height:42px;font-size:14px;flex-shrink:0}
  .bar button.send:active{background:#006fe0}
</style>
</head>

<script>
var firebaseConfig = {

firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var ROOM = 'sammnet_messages';
var ROOM_BOT = 'sammnet_botchannel';
var ROOM_USERS = 'sammnet_users';
var ROOM_AVATARS = 'sammnet_avatars';
var BOT_NAME = 'SAMM BOT';

var VIP_LIST = ['SAMMVIP', 'admin'];

var MUSIC_LIST = [
  { name: '🎵 Bài 1', url: 'https://files.catbox.moe/zy9l6e.mp3' },
  { name: '🎵 Bài 2', url: 'https://files.catbox.moe/g65v1o.mp3' },
  { name: '🎵 Bài 3', url: 'https://files.catbox.moe/zy9l6e.mp3' }

function safeKey(name){
  return name.toLowerCase().replace(/[.#$\[\]\/]/g, '_');
}

function isVIP(name){
  return VIP_LIST.some(function(v){ return v.toLowerCase() === name.toLowerCase(); });
}

db.ref('.info/connected').on('value', function(s){
  console.log(s.val() ? '✅ Firebase OK' : '⚠️ Mất kết nối');
});

function show(id){
  document.querySelectorAll('.auth,.chat').forEach(function(e){ e.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

/* ========== AVATAR ========== */
function resizeImage(file, maxSize, quality){
  maxSize = maxSize || 150;
  quality = quality || 0.8;
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var canvas = document.createElement('canvas');
        var w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
        else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

var regAvatarData = null;

async function previewRegAvatar(e){
  var file = e.target.files[0];
  if (!file) return;
  try {
    regAvatarData = await resizeImage(file, 150, 0.8);
    document.getElementById('regAvPreview').innerHTML =
      '<img src="' + regAvatarData + '"><input type="file" id="regAvFile" accept="image/*" onchange="previewRegAvatar(event)">';
  } catch (err) { alert('Không đọc được ảnh!'); }
}

async function changeMyAvatar(e){
  var file = e.target.files[0];
  if (!file || !currentUser) return;
  try {
    var data = await resizeImage(file, 150, 0.8);
    await db.ref(ROOM_AVATARS + '/' + safeKey(currentUser)).set(data);
    myAvatar = data;
    avatarCache[safeKey(currentUser)] = data;
    updateMyAvatarUI(data);
    document.querySelectorAll('.row.me .av').forEach(function(av){
      av.innerHTML = '<img src="' + data + '">';
    });
    alert('✅ Đã đổi ảnh hồ sơ!');
  } catch (err) { alert('❌ Lỗi: ' + err.message); }
}

function updateMyAvatarUI(dataURL){
  var icon = document.getElementById('myAvIcon');
  if (dataURL) icon.outerHTML = '<img id="myAvIcon" src="' + dataURL + '">';
  else icon.textContent = currentUser ? currentUser[0].toUpperCase() : '?';
}

/* ========== ĐĂNG KÝ ========== */
async function register(){
  var u = rgUser.value.trim();
  var p = rgPass.value;
  var p2 = rgPass2.value;
  var btn = document.getElementById('rgBtn');
  rgErr.textContent = '';
  rgErr.style.color = '#e74c3c';

  if (!u || !p) return rgErr.textContent = 'Vui lòng nhập đầy đủ!';
  if (u.length < 3) return rgErr.textContent = 'Tên phải từ 3 ký tự!';
  if (p.length < 4) return rgErr.textContent = 'Mật khẩu từ 4 ký tự!';
  if (p !== p2) return rgErr.textContent = 'Mật khẩu nhập lại không khớp!';
  if (u.toLowerCase() === BOT_NAME.toLowerCase())
    return rgErr.textContent = 'Tên này dành riêng cho bot!';

  btn.disabled = true;
  rgErr.textContent = '⏳ Đang kiểm tra...';
  rgErr.style.color = '#888';

  try {
    var key = safeKey(u);
    var snap = await db.ref(ROOM_USERS + '/' + key).once('value');
    if (snap.exists()) {
      rgErr.style.color = '#e74c3c';
      rgErr.textContent = '❌ Tên này đã có người dùng!';
      btn.disabled = false;
      return;
    }
    await db.ref(ROOM_USERS + '/' + key).set({ u: u, p: p, created: Date.now() });
    if (regAvatarData) await db.ref(ROOM_AVATARS + '/' + key).set(regAvatarData);
    rgErr.style.color = '#27ae60';
    rgErr.textContent = '✅ Đăng ký thành công!';
    setTimeout(function(){
      rgUser.value = rgPass.value = rgPass2.value = '';
      rgErr.textContent = '';
      btn.disabled = false;
      regAvatarData = null;
      document.getElementById('regAvPreview').innerHTML =
        '<span id="regAvIcon">📷</span><input type="file" id="regAvFile" accept="image/*" onchange="previewRegAvatar(event)">';
      show('loginForm');
      document.getElementById('lgUser').value = u;
      document.getElementById('lgPass').focus();
    }, 1200);
  } catch (e) {
    rgErr.style.color = '#e74c3c';
    rgErr.textContent = '❌ Lỗi: ' + e.message;
    btn.disabled = false;
  }
}

/* ========== ĐĂNG NHẬP ========== */
async function login(){
  var u = lgUser.value.trim();
  var p = lgPass.value;
  var btn = document.getElementById('lgBtn');
  lgErr.textContent = '';
  lgErr.style.color = '#e74c3c';

  if (!u || !p) return lgErr.textContent = 'Nhập tên và mật khẩu!';

  btn.disabled = true;
  lgErr.textContent = '⏳ Đang kiểm tra...';
  lgErr.style.color = '#888';

  try {
    var key = safeKey(u);
    var snap = await db.ref(ROOM_USERS + '/' + key).once('value');
    var data = snap.val();

    var allSnap = await db.ref(ROOM_USERS).once('value');
    if (!allSnap.exists() && key === 'admin' && p === '123456') {
      await db.ref(ROOM_USERS + '/' + key).set({ u: 'admin', p: '123456', created: Date.now() });
      localStorage.setItem('samm_current', 'admin');
      enterChat('admin');
      btn.disabled = false;
      return;
    }

    if (!data || data.p !== p) {
      lgErr.style.color = '#e74c3c';
      lgErr.textContent = '❌ Sai tên hoặc mật khẩu!';
      btn.disabled = false;
      return;
    }
    localStorage.setItem('samm_current', data.u);
    enterChat(data.u);
    btn.disabled = false;
  } catch (e) {
    lgErr.style.color = '#e74c3c';
    lgErr.textContent = '❌ Lỗi: ' + e.message;
    btn.disabled = false;
  }
}

function logout(){
  if (!confirm('Bạn muốn thoát?')) return;
  if (currentUser) {
    var byeMsg = '👋 Tạm biệt mọi người! ' + currentUser + ' đã rời NHÓM SAMM.NET. Hẹn gặp lại! 💛';
    db.ref(ROOM_BOT + '/messages').push({
      user: BOT_NAME, text: byeMsg, time: Date.now(), type: 'leave', who: currentUser
    });
    db.ref(ROOM + '/online/' + safeKey(currentUser)).remove();
  }
  localStorage.removeItem('samm_current');
  setTimeout(function(){ location.reload(); }, 300);
}

/* ========== CHAT ========== */
var mChat = document.getElementById('mChat');
var mBot = document.getElementById('mBot');
var iChat = document.getElementById('i');
var iBot = document.getElementById('iBot');
var currentUser = '';
var myAvatar = null;
var botUnread = 0;
var currentTab = 'chat';
var avatarCache = {};
var processedMusicMsgs = new Set();

function colorOf(str){
  var h = 0;
  for (var i = 0; i < str.length; i++){
    h = (h * 31 + str.charCodeAt(i)) % 360;
  }
  return 'hsl(' + h + ',65%,55%)';
}

function switchTab(t){
  currentTab = t;
  document.getElementById('tabChat').classList.toggle('active', t === 'chat');
  document.getElementById('tabBot').classList.toggle('active', t === 'bot');
  mChat.classList.toggle('hidden', t !== 'chat');
  mBot.classList.toggle('hidden', t !== 'bot');
  document.getElementById('barChat').classList.toggle('hidden', t !== 'chat');
  document.getElementById('barBot').classList.toggle('hidden', t !== 'bot');
  if (t === 'bot'){
    botUnread = 0;
    document.getElementById('botBadge').style.display = 'none';
    mBot.scrollTop = mBot.scrollHeight;
    iBot.focus();
  } else { iChat.focus(); }
}

function renderAvatar(name, dataURL){
  var ini = name[0].toUpperCase();
  var c = colorOf(name);
  if (dataURL) return '<div class="av"><img src="' + dataURL + '"></div>';
  return '<div class="av" style="background:' + c + '">' + ini + '</div>';
}

function renderName(name){
  return esc(name) + (isVIP(name) ? '<span class="tick">✓</span>' : '');
}

function formatSize(bytes){
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1024/1024).toFixed(2) + ' MB';
}

function renderMsgContent(d){
  if (d.type === 'image'){
    return '📷<br><img class="chat-img" src="' + d.url + '" onclick="window.open(\'' + d.url + '\',\'_blank\')">';
  }
  if (d.type === 'file'){
    var sizeTxt = d.size ? formatSize(d.size) : '';
    return '<a class="file-box" href="' + d.url + '" target="_blank" download="' + esc(d.filename) + '">' +
      '<span class="icon">📎</span>' +
      '<span class="info"><b>' + esc(d.filename) + '</b>' + sizeTxt + '</span>' +
      '</a>';
  }
  return esc(d.text || '');
}

function addMe(d){
  var av = renderAvatar(currentUser, myAvatar);
  mChat.insertAdjacentHTML('beforeend',
    '<div class="row me">' + av + '<div class="msg">' + renderMsgContent(d) + '</div></div>');
  mChat.scrollTop = mChat.scrollHeight;
}

function addOther(name, d){
  var av = renderAvatar(name, avatarCache[safeKey(name)] || null);
  mChat.insertAdjacentHTML('beforeend',
    '<div class="row">' + av +
    '<div><div class="name">' + renderName(name) + '</div><div class="msg">' + renderMsgContent(d) + '</div></div></div>');
  mChat.scrollTop = mChat.scrollHeight;
}

function addBotMsg(textOrHTML, isHTML, msgId, isMe){
  var content = isHTML ? textOrHTML : esc(textOrHTML);

  if (isMe){
    var av2 = renderAvatar(currentUser, myAvatar);
    mBot.insertAdjacentHTML('beforeend',
      '<div class="row me">' + av2 +
      '<div class="msg" style="white-space:pre-wrap">' + content + '</div></div>');
  } else {
    mBot.insertAdjacentHTML('beforeend',
      '<div class="row bot">' +
      '<div class="av rainbow-av">🤖</div>' +
      '<div><div class="name rainbow">' + BOT_NAME + '</div><div class="msg" style="white-space:normal">' + content + '</div></div></div>');
  }

  mBot.scrollTop = mBot.scrollHeight;
  if (currentTab !== 'bot'){
    botUnread++;
    var b = document.getElementById('botBadge');
    b.textContent = botUnread;
    b.style.display = 'inline-block';
  }
  if (msgId && !processedMusicMsgs.has(msgId)){
    processedMusicMsgs.add(msgId);
    var audio = mBot.querySelector('audio[data-mid="' + msgId + '"]');
    if (audio) audio.play().catch(function(){});
  }
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ========== GỬI FILE / ẢNH ========== */
var MAX_FILE_SIZE = 700 * 1024;

function setUploadStatus(text){
  var bar = document.getElementById('uploadBar');
  if (!text){ bar.style.display = 'none'; bar.textContent = ''; return; }
  bar.style.display = 'block';
  bar.textContent = text;
}

function fileToDataURL(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(e){ resolve(e.target.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function sendFile(e){
  var file = e.target.files[0];
  e.target.value = '';
  if (!file || !currentUser) return;

  var isImage = file.type.indexOf('image/') === 0;

  if (isImage){
    try {
      setUploadStatus('⏳ Đang nén ảnh...');
      var dataURL = await resizeImage(file, 700, 0.75);
      var estimatedSize = Math.round((dataURL.length - 22) * 3 / 4);

      if (estimatedSize > MAX_FILE_SIZE){
        setUploadStatus('');
        alert('❌ Ảnh sau khi nén vẫn quá lớn (' + formatSize(estimatedSize) + ').\nChọn ảnh nhỏ hơn nhé!');
        return;
      }

      setUploadStatus('⏳ Đang gửi...');
      await db.ref(ROOM + '/messages').push({
        user: currentUser, type: 'image', url: dataURL,
        filename: file.name, time: Date.now()
      });
      setUploadStatus('✅ Đã gửi ảnh!');
      setTimeout(function(){ setUploadStatus(''); }, 1200);
      return;
    } catch (err){
      setUploadStatus('');
      alert('❌ Lỗi gửi ảnh: ' + err.message);
      return;
    }
  }

  if (file.size > MAX_FILE_SIZE){
    setUploadStatus('');
    alert(
      '❌ File quá lớn!\n\n' +
      '📁 ' + file.name + '\n' +
      '📏 ' + formatSize(file.size) + '\n' +
      '✅ Tối đa: 700 KB'
    );
    return;
  }

  try {
    setUploadStatus('⏳ Đang xử lý...');
    var dataURL2 = await fileToDataURL(file);
    setUploadStatus('⏳ Đang gửi...');
    await db.ref(ROOM + '/messages').push({
      user: currentUser, type: 'file', url: dataURL2,
      filename: file.name, size: file.size, time: Date.now()
    });
    setUploadStatus('✅ Đã gửi file!');
    setTimeout(function(){ setUploadStatus(''); }, 1200);
  } catch (err){
    setUploadStatus('');
    alert('❌ Lỗi gửi file: ' + err.message);
  }
}

/* ========== BOT ========== */
async function botReply(text){
  var lower = text.toLowerCase().trim();
  var cmd = lower.split(/\s+/)[0];
  var reply = '';
  var isHTML = false;

  if (lower.indexOf('link') !== -1){
    reply = buildLinkHTML();
    isHTML = true;
    return { reply: reply, isHTML: isHTML };
  }

  if (cmd === '/help'){
    reply = '📋 DANH SÁCH LỆNH:\n' +
      '\n' +
      '📌 link — Xem Quick Guide (link tải)\n' +
      '🎵 /music 1 — Phát nhạc bài 1\n' +
      '🎵 /music 2 — Phát nhạc bài 2\n' +
      '🎵 /music 3 — Phát nhạc bài 3\n' +
      '👤 /vip — Xem hồ sơ của bạn\n' +
      '🏆 /top — Bảng xếp hạng thành viên\n' +
      '📋 /help — Xem danh sách lệnh';
  }
  else if (cmd === '/music'){
    var songNum = parseInt(text.slice(6).trim());
    if (!songNum || songNum < 1 || songNum > MUSIC_LIST.length){
      var listTxt = MUSIC_LIST.map(function(m, i){ return '  /music ' + (i+1) + ' → ' + m.name; }).join('\n');
      reply = '🎵 Cách dùng: /music 1, /music 2, /music 3\n\n📋 DANH SÁCH:\n' + listTxt;
    } else {
      reply = buildMusicHTML(songNum - 1);
      isHTML = true;
    }
  }
  else if (cmd === '/vip'){
    reply = await buildProfileHTML(currentUser);
    isHTML = true;
  }
  else if (cmd === '/top'){
    reply = await buildTopHTML();
    isHTML = true;
  }
  else {
    reply = '❓ Không có lệnh "' + cmd + '".\n\n💡 Gõ /help để xem danh sách lệnh.';
  }

  return { reply: reply, isHTML: isHTML };
}

function buildMusicHTML(index){
  if (index === undefined || index < 0) index = 0;
  var song = MUSIC_LIST[index];
  var html = '<div class="music-box"><div class="label">🎧 ĐANG PHÁT: ' + esc(song.name) + '</div>';
  html += '<audio controls autoplay data-mid="MUSIC_' + Date.now() + '" src="' + song.url + '"></audio>';
  html += '<div style="font-size:11px;color:#888;margin-top:6px">💡 Gõ /music 1, /music 2, /music 3 để đổi bài</div>';
  html += '</div>';
  return html;
}

function buildLinkHTML(){
  var html = '<div style="background:#fff;border-left:4px solid #4fc3f7;border-radius:10px;padding:14px 16px;min-width:250px;max-width:100%;color:#000">';
  html += '<div style="font-size:16px;font-weight:bold;margin-bottom:12px;color:#000">📌 Quick Guide</div>';

  var items = [
    { label: 'Unlock Account', url: 'https://unlockffbeta.com' },
    { label: 'Dashboard', url: 'https://dash.unlockffbeta.com/' },
    { label: 'Latest Localconfig', url: 'https://www.mediafire.com/file/hc10an4kknul0ex/localconfig.json/file' },
    { label: 'MOD APK (ADR)', url: 'https://fnote.net/notes/pQ0DBp' },
    { label: 'MOD iOS', url: 'https://fnote.net/notes/rnP1Rx' }
  ];

  items.forEach(function(item){
    html += '<div style="margin:7px 0;font-size:14px;line-height:1.5">';
    html += '<span style="display:inline-block;width:18px;height:18px;background:#4caf50;border-radius:3px;color:#fff;text-align:center;line-height:18px;font-size:12px;vertical-align:middle;margin-right:6px">✓</span>';
    html += '<span>' + item.label + ': <a href="' + item.url + '" target="_blank" rel="noopener" style="color:#1976d2;text-decoration:underline;font-weight:bold">CLICK HERE</a></span>';
    html += '</div>';
  });

  html += '<div style="margin-top:14px;font-size:14px;color:#000">🔍 <b>Check:</b></div>';
  html += '<div style="font-size:13px;color:#333;margin-top:6px;padding-left:8px">• <code style="background:#eee;padding:2px 6px;border-radius:4px;font-family:monospace">/check</code> (8-12 digits)</div>';
  html += '<div style="font-size:13px;color:#333;margin-top:4px;padding-left:8px">• <code style="background:#eee;padding:2px 6px;border-radius:4px;font-family:monospace">/check</code> (starts with FFLK...)</div>';

  html += '</div>';
  return html;
}

async function buildProfileHTML(username){
  var isV = isVIP(username);
  var av = avatarCache[safeKey(username)] || null;
  var avHTML = av
    ? '<img src="' + av + '" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid #0084ff">'
    : '<div style="width:70px;height:70px;border-radius:50%;background:' + colorOf(username) + ';color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;border:3px solid #0084ff">' + username[0].toUpperCase() + '</div>';

  var statusBadge = isV
    ? '<span style="display:inline-block;background:linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#00ffff,#0000ff,#8b00ff);color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;margin-left:6px">👑 VIP</span>'
    : '<span style="display:inline-block;background:#aaa;color:#fff;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;margin-left:6px">No VIP</span>';

  var html = '<div style="background:#fff;border-radius:12px;padding:16px;min-width:240px;color:#000;border:2px solid #0084ff">';
  html += '<div style="text-align:center;margin-bottom:10px">' + avHTML + '</div>';
  html += '<div style="text-align:center;font-size:17px;font-weight:bold;margin-bottom:8px">' + esc(username) + (isV ? '<span class="tick">✓</span>' : '') + '</div>';
  html += '<div style="text-align:center;margin-bottom:12px">' + statusBadge + '</div>';
  html += '<div style="font-size:13px;color:#444;border-top:1px solid #eee;padding-top:10px">';
  html += '<div style="margin:4px 0">👤 <b>Tên:</b> ' + esc(username) + '</div>';
  html += '<div style="margin:4px 0">🎖️ <b>Trạng thái:</b> ' + (isV ? 'VIP 👑' : 'Thành viên thường') + '</div>';
  html += '<div style="margin:4px 0">📅 <b>Ngày tạo:</b> ' + new Date().toLocaleDateString('vi-VN') + '</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

async function buildTopHTML(){
  var snap = await db.ref(ROOM_USERS).once('value');
  var users = snap.val() || {};
  var list = [];
  Object.keys(users).forEach(function(k){
    list.push(users[k].u);
  });

  list.sort(function(a, b){
    var aV = isVIP(a) ? 0 : 1;
    var bV = isVIP(b) ? 0 : 1;
    if (aV !== bV) return aV - bV;
    return a.localeCompare(b);
  });

  var vipIndex = list.findIndex(function(n){ return n.toLowerCase() === 'sammvip'; });
  if (vipIndex > 0){
    var vip = list.splice(vipIndex, 1)[0];
    list.unshift(vip);
  }

  var html = '<div style="background:#fff;border-radius:12px;padding:14px;min-width:270px;color:#000;border:2px solid #ffc107">';
  html += '<div style="text-align:center;font-size:17px;font-weight:bold;margin-bottom:12px">🏆 BẢNG XẾP HẠNG</div>';

  var medals = ['🥇', '🥈', '🥉'];

  list.forEach(function(name, i){
    var rank = i + 1;
    var medal = medals[i] || ('#' + rank);
    var isV = isVIP(name);
    var av = avatarCache[safeKey(name)] || null;
    var avHTML = av
      ? '<img src="' + av + '" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #ffc107">'
      : '<div style="width:36px;height:36px;border-radius:50%;background:' + colorOf(name) + ';color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;border:2px solid #ffc107">' + name[0].toUpperCase() + '</div>';

    html += '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f0f0">';
    html += '<div style="font-size:16px;font-weight:bold;width:34px;text-align:center">' + medal + '</div>';
    html += '<div>' + avHTML + '</div>';
    html += '<div style="flex:1;font-size:14px;font-weight:bold">' + esc(name) + (isV ? '<span class="tick">✓</span>' : '') + '</div>';
    if (isV) html += '<div style="font-size:11px;color:#d39e00;font-weight:bold">👑 VIP</div>';
    html += '</div>';
  });

  html += '<div style="font-size:11px;color:#888;margin-top:10px;text-align:center">Tổng: ' + list.length + ' thành viên</div>';
  html += '</div>';
  return html;
}

function send(){
  var t = iChat.value.trim();
  if (!t || !currentUser) return;
  iChat.value = '';
  iChat.focus();
  db.ref(ROOM + '/messages').push({ user: currentUser, type: 'text', text: t, time: Date.now() })
    .catch(function(e){ alert('❌ Không gửi được!\n\nLỗi: ' + e.message); });
}

function sendBot(){
  var t = iBot.value.trim();
  if (!t || !currentUser) return;
  iBot.value = '';
  iBot.focus();

  addBotMsg(t, false, null, true);

  if (t.indexOf('/') === 0 || t.toLowerCase().indexOf('link') !== -1) {
    setTimeout(async function(){
      var res = await botReply(t);
      db.ref(ROOM_BOT + '/messages').push({
        user: BOT_NAME, text: res.reply, isHTML: res.isHTML, time: Date.now()
      });
    }, 400);
  } else {
    db.ref(ROOM_BOT + '/messages').push({
      user: BOT_NAME, text: '💬 ' + currentUser + ': ' + t, time: Date.now()
    });
  }
}

async function enterChat(username){
  currentUser = username;
  document.getElementById('welcome').textContent = 'Xin chào, ' + username + '!';

  try {
    var avSnap = await db.ref(ROOM_AVATARS + '/' + safeKey(username)).once('value');
    myAvatar = avSnap.val() || null;
    updateMyAvatarUI(myAvatar);
  } catch(e){ console.error(e); }

  try {
    var avSnap2 = await db.ref(ROOM_AVATARS).once('value');
    var all = avSnap2.val() || {};
    Object.entries(all).forEach(function(pair){ avatarCache[pair[0]] = pair[1]; });
  } catch(e){ console.error(e); }

  mChat.innerHTML = '';
  mBot.innerHTML = '';
  botUnread = 0;
  document.getElementById('botBadge').style.display = 'none';
  show('chatApp');
  switchTab('chat');

  var meRef = db.ref(ROOM + '/online/' + safeKey(username));
  meRef.set(true);
  meRef.onDisconnect().remove();

  setTimeout(function(){
    var joinMsg = '👋 Xin chào mọi người! ' + username + ' vừa vào NHÓM SAMM.NET. Chúc ' + username + ' trò chuyện vui vẻ! 🎉';
    db.ref(ROOM_BOT + '/messages').push({
      user: BOT_NAME, text: joinMsg, time: Date.now(), type: 'join', who: username
    });
  }, 500);

  db.ref(ROOM + '/messages').limitToLast(100).on('child_added', function(snap){
    var d = snap.val();
    if (!d) return;
    if (d.user === BOT_NAME) return;
    if (d.user === username) addMe(d);
    else addOther(d.user, d);
  });

  db.ref(ROOM_BOT + '/messages').limitToLast(100).on('child_added', function(snap){
    var d = snap.val();
    if (!d) return;
    if ((d.type === 'join' || d.type === 'leave') && d.who === username) return;
    if (d.isHTML) addBotMsg(d.text, true, snap.key, false);
    else addBotMsg(d.text, false, null, false);
  });

  db.ref(ROOM + '/online').on('value', function(snap){
    var names = Object.keys(snap.val() || {});
    document.getElementById('welcome').textContent =
      'Xin chào, ' + username + '! (' + names.length + ' người online)';
  });

  db.ref(ROOM_AVATARS).on('child_changed', function(snap){ avatarCache[snap.key] = snap.val(); });
  db.ref(ROOM_AVATARS).on('child_added', function(snap){ avatarCache[snap.key] = snap.val(); });

  iChat.focus();
}

iChat.addEventListener('keydown', function(e){ if (e.key === 'Enter') send(); });
iBot.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendBot(); });

document.addEventListener('keydown', function(e){
  if (e.key === 'Enter'){
    if (document.getElementById('loginForm').classList.contains('active')) login();
    else if (document.getElementById('regForm').classList.contains('active')) register();
  }
});

window.addEventListener('load', async function(){
  var saved = localStorage.getItem('samm_current');
  if (!saved) return;
  try {
    var snap = await db.ref(ROOM_USERS + '/' + safeKey(saved)).once('value');
    if (snap.exists()) enterChat(saved);
    else localStorage.removeItem('samm_current');
  } catch (e) { console.error(e); }
});
